name: Sync formula
# Pulls the formula that each ts-go release generates, so the tap needs no
# cross-repository token: this workflow writes only to this repository.
# The publish job commits the same candidate artifact that the test job checked.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-formula
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.fetch.outputs.tag }}
      sha256: ${{ steps.fetch.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Fetch latest release formula
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo TerraScale/ts-go --json tagName -q .tagName)
          [[ "$tag" =~ ^v0\.0\.(0|[1-9][0-9]*)$ ]]
          dir="$RUNNER_TEMP/release"
          gh release download "$tag" --repo TerraScale/ts-go --pattern ts.rb --pattern checksums.txt --dir "$dir"
          grep -qx "  version \"${tag#v}\"" "$dir/ts.rb"
          # Every URL must be a release asset of this tag with its published checksum.
          urls=$(grep -oE 'url "[^"]+"' "$dir/ts.rb" | cut -d'"' -f2)
          [ -n "$urls" ]
          for url in $urls; do
            case "$url" in "https://github.com/TerraScale/ts-go/releases/download/$tag/"*) ;; *) exit 1 ;; esac
            name=${url##*/}
            sum=$(awk -v n="$name" '$2 == n { print $1 }' "$dir/checksums.txt")
            [ -n "$sum" ]
            grep -q "sha256 \"$sum\"" "$dir/ts.rb"
          done
          mkdir -p candidate
          cp "$dir/ts.rb" candidate/ts.rb
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum candidate/ts.rb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formula-candidate
          path: candidate/ts.rb
          if-no-files-found: error
          retention-days: 1
  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formula-candidate
          path: candidate
      - name: Validate candidate Ruby syntax
        run: ruby -c candidate/ts.rb
  publish:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formula-candidate
          path: candidate
      - name: Commit formula
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA256: ${{ needs.prepare.outputs.sha256 }}
        run: |
          set -euo pipefail
          [ "$(sha256sum candidate/ts.rb | cut -d' ' -f1)" = "$SHA256" ]
          mkdir -p Formula
          cp candidate/ts.rb Formula/ts.rb
          git add Formula/ts.rb
          git diff --cached --quiet && exit 0
          git config user.name 'TerraScale'
          git config user.email 'releases@terrascale.tech'
          git commit -m "Update ts to ${TAG#v}"
          git push
