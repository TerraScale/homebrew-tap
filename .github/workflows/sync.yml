name: Sync formula
# Pulls the formula that each sdk/go release generates in terrascale, so the tap needs no
# cross-repository token: this workflow writes only to this repository.
# The publish job commits the same candidate artifact that the test job checked.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-formula
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.fetch.outputs.tag }}
      sha256: ${{ steps.fetch.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Fetch latest release formula
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Other monorepo areas publish releases too; select only stable Go SDK tags.
          tag=$(gh api --paginate 'repos/TerraScale/terrascale/releases?per_page=100' \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^sdk/go/v0\\.0\\.(0|[1-9][0-9]*)$"))' |
            sort -V | tail -n 1)
          [[ "$tag" =~ ^sdk/go/v0\.0\.(0|[1-9][0-9]*)$ ]]
          dir="$RUNNER_TEMP/release"
          gh release download "$tag" --repo TerraScale/terrascale --pattern ts.rb --pattern checksums.txt --dir "$dir"
          # Bind each platform's URL to that exact asset's checksum, not any hash in the formula.
          python3 - "$dir" "$tag" <<'PYTHON'
          import re
          import sys
          from pathlib import Path

          directory = Path(sys.argv[1])
          tag = sys.argv[2]
          version = tag.removeprefix("sdk/go/v")
          formula = (directory / "ts.rb").read_text()
          assert re.findall(r'^  version "([^"]+)"$', formula, re.M) == [version]
          checksums = {}
          for line in (directory / "checksums.txt").read_text().splitlines():
              digest, name = line.split()
              assert re.fullmatch(r"[0-9a-f]{64}", digest) and name not in checksums
              checksums[name] = digest
          pairs = re.findall(r'url "([^"]+)"\s+sha256 "([0-9a-f]{64})"', formula)
          urls = re.findall(r'url "([^"]+)"', formula)
          assert len(pairs) == len(urls) == 4
          base = f"https://github.com/TerraScale/terrascale/releases/download/{tag}/"
          expected = {f"ts_{platform}_{arch}.tar.gz" for platform in ("darwin", "linux") for arch in ("amd64", "arm64")}
          seen = set()
          for url, digest in pairs:
              assert url.startswith(base), "Formula URL is not an asset of the selected Go release"
              name = url.removeprefix(base)
              assert name in expected and name not in seen and checksums.get(name) == digest
              seen.add(name)
          assert seen == expected
          current = Path("Formula/ts.rb")
          if current.exists():
              current_versions = re.findall(r'^  version "(0\.0\.[0-9]+)"$', current.read_text(), re.M)
              assert len(current_versions) == 1
              assert int(version.split(".")[-1]) >= int(current_versions[0].split(".")[-1]), "Refusing formula downgrade"
          PYTHON
          mkdir -p candidate
          cp "$dir/ts.rb" candidate/ts.rb
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum candidate/ts.rb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formula-candidate
          path: candidate/ts.rb
          if-no-files-found: error
          retention-days: 1
  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formula-candidate
          path: candidate
      - name: Validate candidate Ruby syntax
        run: ruby -c candidate/ts.rb
  publish:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formula-candidate
          path: candidate
      - name: Commit formula
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA256: ${{ needs.prepare.outputs.sha256 }}
        run: |
          set -euo pipefail
          [ "$(sha256sum candidate/ts.rb | cut -d' ' -f1)" = "$SHA256" ]
          mkdir -p Formula
          cp candidate/ts.rb Formula/ts.rb
          git add Formula/ts.rb
          git diff --cached --quiet && exit 0
          git config user.name 'TerraScale'
          git config user.email 'releases@terrascale.tech'
          git commit -m "Update ts to ${TAG#sdk/go/v}"
          git push
