name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    uses: TerraScale/.github/.github/workflows/command.yml@3a54c0184eacdc45466c1123bca67a99db62e91c
    with:
      command: |
        shopt -s nullglob
        for formula in Formula/*.rb; do
          ruby -c "$formula"
        done
